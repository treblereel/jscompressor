name: Publish native image

on:
  push:
    tags:
      - 'v*'
      - 'r*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag
        required: true
        default: edge
        type: string
      publish_latest:
        description: Also update the latest tag
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish linux/amd64
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test native executable
        run: >-
          mvn --batch-mode --no-transfer-progress clean verify -Pnative
          -Dquarkus.native.container-build=true
          -DskipITs=false

      - name: Smoke-test native container
        run: |
          docker build --file src/main/docker/Dockerfile.native --tag jscompressor-native:test .
          docker run --detach --name jscompressor-native-test --publish 127.0.0.1:18080:8080 jscompressor-native:test
          trap 'docker logs jscompressor-native-test; docker rm --force jscompressor-native-test' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/q/health/ready; then
              exit 0
            fi
            sleep 1
          done

          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/treblereel/jscompressor
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'push' || inputs.publish_latest }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/main/docker/Dockerfile.native
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=native-image
          cache-to: type=gha,mode=max,scope=native-image
